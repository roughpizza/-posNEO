function mkDb(){
 function chk(r){if(r&&r.error)throw r.error;return r}
 return{collection:function(c){return{
  doc:function(id){return{
   set:async function(d){chk(await SB.from("docs").upsert({collection:c,id:id,data:d},{onConflict:"collection,id"}))},
   upd:async function(d){chk(await SB.from("docs").update({data:d}).eq("collection",c).eq("id",id))},
   get:async function(){var r=chk(await SB.from("docs").select("data").eq("collection",c).eq("id",id).maybeSingle());return{exists:!!r.data,data:function(){return r.data?r.data.data:undefined}}},
   delete:async function(){chk(await SB.from("docs").delete().eq("collection",c).eq("id",id))}
  }},
  onSnapshot:function(ok,ng){
   var alive=true,run=false,again=false,tm=0;
   async function load(){
    if(run){again=true;return}run=true;
    try{
     var all=[],from=0,step=1000;
     for(;;){var r=chk(await SB.from("docs").select("id,data").eq("collection",c).order("id").range(from,from+step-1));all=all.concat(r.data);if(r.data.length<step)break;from+=step}
     if(alive)ok({docs:all.map(function(x){return{id:x.id,data:function(){return x.data}}})});
    }catch(e){if(alive&&ng)ng(e)}
    run=false;if(again){again=false;load()}
   }
   load();
   var ch=SB.channel("docs-"+c+"-"+Math.random().toString(36).slice(2)).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"collection=eq."+c},function(){clearTimeout(tm);tm=setTimeout(load,300)}).subscribe();
   return function(){alive=false;SB.removeChannel(ch)}
  }
 }}}}
